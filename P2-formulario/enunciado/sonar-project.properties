# Configuración del análisis de SonarQube. Sin secretos: el token va en .env (SONAR_TOKEN), que no se sube.
sonar.projectKey=dwcle-p2-formulario
sonar.projectName=DWCLE P2 · Formulario
sonar.host.url=http://localhost:3300

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
