# SonarQube Community Build + PostgreSQL, en local.
# `name` fijo: todos los proyectos del curso comparten el MISMO SonarQube (mismos contenedores y datos),
# da igual desde qué práctica lo arranques con `npm run sonar:up`.
name: dwcle-sonarqube

services:
  sonarqube:
    image: sonarqube:community
    depends_on:
      - postgres
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - '3300:9000'
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped

# Volúmenes con nombre: Docker los gestiona, sin carpetas ni permisos que preparar (también en Windows y macOS)
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
